name: Site checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  # The dev stand builds this Dockerfile on every merge to main: a broken image
  # must fail here, not on the stand.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t nsp-center:ci .
      - name: Smoke-test the image
        run: |
          docker run -d --name nsp -p 4173:4173 nsp-center:ci
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:4173/ && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:4173/
          curl -fsS -o /dev/null http://127.0.0.1:4173/catalog/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/nope/)" = 404
