<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Главный экран телефона — три варианта</title><link rel="stylesheet" href="/fonts/hero-options/fonts.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ee;color:#1d3a36;font:14px Manrope,Arial,sans-serif}header{padding:24px 28px 18px;display:flex;justify-content:space-between;align-items:end;gap:20px}h1{font-size:25px;margin:0 0 6px;font-weight:600}header p{margin:0;color:#60756d;font-size:13px}header>a,a{color:#1d3a36;text-underline-offset:4px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:0 24px 24px}.option{padding:16px;background:#fff;border:1px solid #c7d4cc;border-radius:20px;min-width:0}.option-head{min-height:64px;display:flex;gap:10px;align-items:start;margin-bottom:14px}.number{display:grid;place-items:center;width:30px;height:30px;flex:none;border-radius:50%;background:#1d3a36;color:white}.option h2{font-size:17px;font-weight:600;margin:0 0 5px}.option p{font-size:12px;line-height:1.5;margin:0;color:#60756d}.label{font-size:10px;color:#60756d;margin:14px 0 7px;text-transform:uppercase;letter-spacing:.08em}.screen{position:relative;overflow:hidden;border:1px solid #c7d4cc;border-radius:9px;background:#fff}.screen iframe{display:block;border:0;transform-origin:0 0;pointer-events:none}.phone{width:300px;max-width:100%;margin:0 auto;border:4px solid #1d3a36;border-radius:25px}.phone-label{text-align:center}.links{display:flex;justify-content:center;gap:16px;font-size:12px;margin-top:16px}.loading{padding:20px;text-align:center}.single header{padding:8px 16px;align-items:center}.single header h1{font-size:16px;margin:0}.single header p{display:none}.single .grid{display:block;padding:0}.single .option{border:0;background:transparent;border-radius:0;padding:0}.single .option-head,.single .label,.single .links{display:none}.single .screen{margin:auto;border-radius:0}.single .phone{border:0}.single .screen iframe{pointer-events:auto}@media(max-width:1000px){.grid{grid-template-columns:1fr}.option{display:grid;grid-template-columns:minmax(0,1fr) 150px;column-gap:20px}.option-head,.links{grid-column:1/-1}.laptop-label{grid-column:1;grid-row:2}.laptop{grid-column:1;grid-row:3}.phone-label{grid-column:2;grid-row:2}.phone{grid-column:2;grid-row:3}.single .option{display:block}}@media(max-width:550px){header{padding:20px;display:block}header>a{display:block;margin-top:12px}.grid{padding:0 12px 20px}.option{display:block}.phone{margin-top:8px}.phone-label{margin-top:18px}}
.option{display:block}.phone-label{margin-top:8px}.single .phone{width:402px}@media(max-width:1000px){.option{display:block}}
</style></head><body><header><div><h1>Главный экран на телефоне</h1><p>Три варианта расположения заголовка и кнопки</p></div><a href="/">На сайт →</a></header><main class="grid"><p class="loading">Загружаем варианты…</p></main><script>
const variants=[
 {id:1,title:'Компактная кнопка',description:'Заголовок по центру, небольшая светлая кнопка сразу под ним.',css:`.home-hero.home-hero--forest{padding-top:22px}.home-hero.home-hero--forest .hero-photo img{object-position:center bottom}.home-hero.home-hero--forest .hero-copy .btn--primary svg{display:block;width:18px;height:18px;flex:none}.home-hero.home-hero--forest .hero-copy .btn--primary{font-size:14px;font-weight:600;line-height:1.2;gap:12px}.home-hero.home-hero--forest .hero-copy h1{margin-bottom:12px}.home-hero.home-hero--forest .hero-copy h1 .hero-title-line{text-align:center}.home-hero.home-hero--forest .hero-copy .btn--primary{width:auto;min-height:40px;padding:10px 18px;border-radius:999px}`},
 {id:2,title:'Лёгкая ссылка',description:'Текст слева и переход со стрелкой без крупной плашки.',css:`.home-hero.home-hero--forest{padding-top:22px}.home-hero.home-hero--forest .hero-photo img{object-position:center bottom}.home-hero.home-hero--forest .hero-copy .btn--primary svg{display:block;width:18px;height:18px;flex:none}.home-hero.home-hero--forest .hero-copy .btn--primary{font-size:14px;font-weight:600;line-height:1.2;gap:12px}.home-hero.home-hero--forest .hero-copy{text-align:left}.home-hero.home-hero--forest .hero-copy h1{margin-bottom:8px}.home-hero.home-hero--forest .hero-copy h1 .hero-title-line{text-align:left}.home-hero.home-hero--forest .hero-copy .ds-cluster{justify-content:flex-start}.home-hero.home-hero--forest .hero-copy .btn--primary{width:auto;min-height:44px;padding:0;background:transparent;border:0;border-radius:0;box-shadow:none;color:#fff;font-size:15px}`},
 {id:3,title:'Кнопка внизу кадра',description:'Сверху — только заголовок. Переход к товарам под изображением баночек.',css:`.home-hero.home-hero--forest{padding-top:22px}.home-hero.home-hero--forest .hero-photo img{object-position:center bottom}.home-hero.home-hero--forest .hero-copy .btn--primary svg{display:block;width:18px;height:18px;flex:none}.home-hero.home-hero--forest .hero-copy .btn--primary{font-size:14px;font-weight:600;line-height:1.2;gap:12px}.home-hero.home-hero--forest .hero-copy{position:static}.home-hero.home-hero--forest .hero-copy h1 .hero-title-line{text-align:center}.home-hero.home-hero--forest .hero-copy .ds-cluster{position:absolute;bottom:14px;left:18px;right:18px;z-index:3}.home-hero.home-hero--forest .hero-copy .btn--primary{width:100%;min-height:44px;padding:10px 18px;border-radius:16px;justify-content:space-between}.home-hero.home-hero--forest>.hero-note--phone{position:absolute;bottom:72px;left:18px;right:18px;margin:0;padding:0;justify-content:center}`}
];
const params=new URLSearchParams(location.search),chosen=Number(params.get('variant')),device=params.get('device'),single=variants.some(v=>v.id===chosen)&&['phone','laptop'].includes(device);
if(single){document.body.classList.add('single');document.querySelector('header>a').href='/hero-mobile-options.html';document.querySelector('header>a').textContent='← Все три варианта';document.querySelector('h1').textContent=variants.find(v=>v.id===chosen).title}
const grid=document.querySelector('main');
const fit=box=>{const frame=box.querySelector('iframe'),w=Number(frame.dataset.width),h=Number(frame.dataset.height);let width=box.clientWidth;if(single){width=Math.min(w,innerWidth,((innerHeight-document.querySelector('header').offsetHeight)/h)*w);box.style.width=width+'px'}frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+width/w+')';box.style.height=(width*h/w+box.offsetWidth-box.clientWidth)+'px'};
(async()=>{try{
 const source=await(await fetch('/')).text();
 const clean=source.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,'').replace(/<html[^>]*>/i,'<html lang="ru">');
 grid.innerHTML='';
 for(const v of single?variants.filter(v=>v.id===chosen):variants){
  const card=document.createElement('section');card.className='option';card.dataset.variant=v.id;
  card.innerHTML='<div class="option-head"><span class="number">'+v.id+'</span><div><h2>'+v.title+'</h2><p>'+v.description+'</p></div></div>';
  for(const kind of ['phone']){
   const phone=kind==='phone',w=phone?402:1470,h=phone?874:919;
   const label=document.createElement('div');label.className='label '+kind+'-label';label.textContent=phone?'Телефон':'Ноутбук';card.append(label);
   const box=document.createElement('div');box.className='screen '+kind;
   const iframe=document.createElement('iframe');iframe.title=v.title+' — '+label.textContent;iframe.dataset.width=w;iframe.dataset.height=h;
   const css=`html{scrollbar-width:none}::-webkit-scrollbar{display:none}.preview-phone-hardware{position:absolute;top:0;left:0;right:0;height:62px;z-index:200;pointer-events:none}.preview-phone-hardware span{position:absolute;left:28px;top:20px;font:600 15px Arial,sans-serif;color:#1d3a36}.preview-phone-hardware i{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:30px;background:#000}html:root{--site-header-height:123px;--phone-header-height:123px;--phone-first-screen-height:665px}body .site-header{padding-top:62px}.bottom-nav{padding-bottom:38px}.home-hero.home-hero--forest{min-height:665px}.nsp-launch,.install-banner,.install-banner-backdrop{display:none!important}`+v.css;
   iframe.srcdoc=clean.replace('</head>','<style>'+css+'</style></head>').replace('<body>','<body><div class="preview-phone-hardware" aria-hidden="true"><span>9:41</span><i></i></div>');box.append(iframe);card.append(box);
   iframe.addEventListener('load',async()=>{await iframe.contentDocument.fonts.ready;box.dataset.ready='true';fit(box)});
   
  }
  const links=document.createElement('div');links.className='links';links.innerHTML='<a href="?variant='+v.id+'&device=phone">Открыть крупнее</a>';card.append(links);grid.append(card);
 }
}catch(e){grid.innerHTML='<p class="loading">Не удалось загрузить. Обновите страницу.</p>'}})();
addEventListener('resize',()=>document.querySelectorAll('.screen').forEach(fit));
</script></body></html>
