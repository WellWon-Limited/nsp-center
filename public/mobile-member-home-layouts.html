 const bottom=overview.querySelector('.plan-bottom');
 const template=document.createElement('template');template.innerHTML=tasks(false);
 const rows=[...template.content.children].map((row,index)=>({row,index})).filter(({index})=>!plan[index][2]).slice(0,2);
 for(const {row,index} of rows){row.querySelector('input').addEventListener('change',event=>{plan[index][2]=event.currentTarget.checked;renderPendingIntake()});overview.insertBefore(row,bottom)}
 if(!rows.length){const message=document.createElement('p');message.className='plan-complete';message.setAttribute('role','status');message.textContent=plan.length?'На сегодня всё отмечено':'Планов на сегодня ещё нет';overview.insertBefore(message,bottom)}
 const done=plan.filter(item=>item[2]).length;
 overview.querySelector('.progress').hidden=!plan.length;
 overview.querySelector('.meter').hidden=!plan.length;
 overview.querySelector('.progress').textContent=done+' из '+plan.length;
 overview.querySelector('.meter i').style.width=(plan.length?done/plan.length*100:0)+'%';
};
renderPendingIntake();
const browse=document.createElement('section');browse.className='browse-section';browse.id='home-explore';
browse.innerHTML='<div class="browse-heading"><span class="eyebrow">NSP Center</span><h2>'+'Продукты и полезное'+'</h2><p>Категории, продукты, журнал и знакомство с центром</p></div><div class="loading-note">Загружаем главную страницу…</div><iframe class="browse-frame" scrolling="no" title="Все разделы главной страницы NSP Center" src="/?design=d&amp;phone=1&amp;member-preview=1" loading="eager"></iframe><div class="layout-caption">Вариант 0'+layout+' · пример личного плана. Ниже — настоящие блоки текущей главной.</div>';
content.replaceChildren(first,browse);
const frame=browse.querySelector('iframe');
let headingPending=true;
const prepareHeading=()=>{const doc=frame.contentDocument,heading=doc?.querySelector('.hero-copy h1');if(!heading)return;headingPending=true;doc.documentElement.classList.add('member-heading-wait');heading.classList.remove('hero-heading--enter')};
const revealVisibleHeading=()=>{if(!headingPending||!frame.classList.contains('ready'))return;const doc=frame.contentDocument,heading=doc?.querySelector('.hero-copy h1');if(!heading)return;const box=heading.getBoundingClientRect(),top=frame.getBoundingClientRect().top+box.top,headerBottom=document.querySelector('.header').getBoundingClientRect().bottom;if(top<headerBottom-16||top+box.height>window.innerHeight-40)return;headingPending=false;doc.documentElement.classList.remove('member-heading-wait');void heading.offsetWidth;heading.classList.add('hero-heading--enter')};
window.addEventListener('scroll',revealVisibleHeading,{passive:true});
window.addEventListener('resize',revealVisibleHeading,{passive:true});
frame.addEventListener('load',()=>{
 const doc=frame.contentDocument;if(!doc)return;
 if(!doc.getElementById('member-preview-style')){const style=doc.createElement('style');style.id='member-preview-style';style.textContent=`html.member-heading-wait .hero-title-word{animation:none!important;opacity:0;transform:translateY(12px)}html{background:transparent!important;overflow:hidden!important}body{padding-bottom:0!important;background:transparent!important;overflow:hidden!important}body,#root,.site-main{min-height:0!important;height:auto!important}#root{background:transparent!important}.ambient{display:none!important}body::after,.site-header,.bottom-nav,.install-banner,.install-backdrop,.nsp-launch,.notifications-panel{display:none!important}.site-main{padding-top:0!important}.home-first-screen{min-height:${Math.max(0,window.innerHeight-document.querySelector(".header").getBoundingClientRect().height-18)}px!important;height:auto!important}.home-first-screen+.section{margin-top:0!important}.home-hero>.hero-daily{display:none!important}.site-footer{padding-bottom:20px!important}`;doc.head.append(style)}
 const resize=()=>{const height=Math.ceil(doc.querySelector('#root').getBoundingClientRect().height);if(height>0&&Math.abs(frame.getBoundingClientRect().height-height)>1)frame.style.height=height+'px';if(frame.contentWindow.scrollY)frame.contentWindow.scrollTo({top:0,behavior:'instant'})};
 prepareHeading();resize();new ResizeObserver(resize).observe(doc.body);frame.classList.add('ready');browse.querySelector('.loading-note')?.remove();requestAnimationFrame(revealVisibleHeading);
});
const makeTabs=()=>{const div=document.createElement('div');div.className='view-tabs';div.innerHTML='<button class="active" data-view="day" type="button">Мой день</button><button data-view="explore" type="button">Вся главная</button>';return div};
if(layout==='2'){
 const tabs=makeTabs();first.insertBefore(tabs,first.querySelector('.daily'));
 const explore=document.createElement('div');explore.className='explore-top';explore.hidden=true;explore.innerHTML='<span class="eyebrow">NSP Center</span><h1>Продукты и забота</h1>';explore.append(makeTabs());content.insertBefore(explore,browse);browse.hidden=true;
 document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{const day=button.dataset.view==='day';first.hidden=!day;explore.hidden=day;browse.hidden=day;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===button.dataset.view));window.scrollTo({top:0,behavior:'instant'});if(!day)frame.dispatchEvent(new Event('resize'))}));
}
if(layout==='3'){
 const shortcuts=document.createElement('nav');shortcuts.className='section-shortcuts';shortcuts.setAttribute('aria-label','Разделы главной');shortcuts.innerHTML='<a href="#home-explore" data-target="overview">Продукты '+icon('chevron')+'</a><a href="#home-explore" data-target="[data-ds-id=home-blog]">Журнал '+icon('chevron')+'</a><a href="#home-explore" data-target="#home-about">О центре '+icon('chevron')+'</a>';first.insertBefore(shortcuts,first.querySelector('.daily'));
 shortcuts.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();if(a.dataset.target==='overview')prepareHeading();const headerHeight=document.querySelector('.header').getBoundingClientRect().height;const target=a.dataset.target==='overview'?null:frame.contentDocument?.querySelector(a.dataset.target);const top=target?frame.getBoundingClientRect().top+window.scrollY+target.getBoundingClientRect().top-16:browse.offsetTop;window.scrollTo({top:top-headerHeight,behavior:'smooth'});requestAnimationFrame(revealVisibleHeading)}));
}
</script>
</body></html>
