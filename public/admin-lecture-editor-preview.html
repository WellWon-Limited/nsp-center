ех процессов обменных для того, чтобы эта гиперстимуляция произошла с наименьшим уроном. Здесь я пишу длительность приема месяц, но такие месячные курсы можно повторять три-четыре раза в год. Дальше здесь у нас идут препараты, которые в общем-то не влияют на само снижение гиперфункции, но они критично критично важны при болезни грейвса, потому что если будут дефициты по вот этим вот фронтам селен витамин d и магний, то урон который получит щитовидная железа в частности, он будет намного больше. В целом все препараты для покрытия дефицитов, которые были озвучены в первой части Юлия Колосс, они актуальны."}]}</script><script>

 const renderSources=()=>{d.getElementById('ed-sources').innerHTML=[...attached.values()].map(s=>`<li class="ed-source"><span>${escape(s.lecture)}<small>${escape(s.speaker)}</small></span><button type="button" data-remove="${s.id}" aria-label="Убрать источник">×</button></li>`).join('');d.getElementById('source-count').textContent=attached.size;d.getElementById('source-empty').hidden=attached.size>0;};
 const render=()=>{const term=query.toLowerCase().replace(/й$/,'').trim();const rows=data.lectures.filter(s=>!term||[s.lecture,s.speaker,s.excerpt,s.context].join(' ').toLowerCase().includes(term)).slice(0,3);d.getElementById('ed-found-label').textContent=rows.length?`Показаны ${rows.length} фрагмента`:'В примере нет совпадений';d.getElementById('ed-results').innerHTML=rows.length?rows.map(s=>`<article class="ed-result"><h3>${escape(s.lecture)}</h3><p class="ed-byline">${escape(s.speaker)} · ${escape(s.course)}</p><p class="ed-excerpt">${highlight(s.excerpt)}</p><div class="ed-result-actions"><button type="button" class="ed-link" data-context="${s.id}" aria-expanded="false">Открыть контекст ‹</button><button type="button" class="ed-link" data-attach="${s.id}">${attached.has(s.id)?'✓ Прикреплено':'+ Прикрепить'}</button></div><div class="ed-context" id="context-${s.id}" hidden>${escape(s.context)}</div></article>`).join(''):'<p class="ed-hint">Это макет на нескольких фрагментах. Верните запрос «магний», чтобы посмотреть пример.</p>';};
 main.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.attach){const s=data.lectures.find(x=>x.id===b.dataset.attach);attached.set(s.id,s);renderSources();render();notice('Источник прикреплён к черновику. Текст заполните вручную по смыслу фрагмента.');}if(b.dataset.context){const node=d.getElementById('context-'+b.dataset.context);node.hidden=!node.hidden;b.setAttribute('aria-expanded',String(!node.hidden));b.textContent=node.hidden?'Открыть контекст ‹':'Скрыть контекст ‹';}if(b.dataset.remove){attached.delete(b.dataset.remove);renderSources();render();}});
 d.getElementById('ed-search').addEventListener('submit',e=>{e.preventDefault();query=d.getElementById('ed-query').value;render()});
 d.getElementById('ed-query').addEventListener('input',e=>{query=e.target.value;render()});
 d.getElementById('ed-save').onclick=()=>notice('Это предпросмотр: реальные данные товара не изменены.');
 d.getElementById('ed-cancel').onclick=()=>notice('Пример остаётся открытым; реальные данные не менялись.');
 d.getElementById('ed-back').onclick=e=>{e.preventDefault();notice('Открыт макет редактора. Остальные разделы админки не изменены.')};
 d.getElementById('add-area').onclick=()=>notice('В рабочем редакторе здесь выбирается направление теста и заполняется пояснение.');
 d.getElementById('add-pair').onclick=()=>notice('В рабочем редакторе здесь выбирается товар из каталога и заполняется «Почему сочетают».');
 renderSources();render();w.scrollTo({top:0,behavior:'instant'});frame.classList.add('ready');window.previewReady=true;
 };
 frame.src='/admin/?lecture-editor-preview=1';
})();
