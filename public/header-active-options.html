<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Варианты выделения вкладки</title><style>html,body{height:100%;margin:0;background:#eaf3f1}iframe{display:block;width:100%;height:100%;border:0;visibility:hidden}iframe.ready{visibility:visible}</style><iframe src="/catalog/" title="Вариант выделения выбранной вкладки"></iframe><script>
const v=new URLSearchParams(location.search).get('v')||'1',frame=document.querySelector('iframe');document.title=['','01 · Тёмная линия','02 · Тёмная плашка','03 · Светлая мятная плашка'][v];
frame.addEventListener('load',async()=>{
 const d=frame.contentDocument;
 await new Promise(resolve=>{const root=d.querySelector('#root');if(!root||root.dataset.hydrated==='true'){resolve();return}const o=new MutationObserver(()=>{if(root.dataset.hydrated==='true'){o.disconnect();resolve()}});o.observe(root,{attributes:true,attributeFilter:['data-hydrated']})});
 const base='.site-header--shared .desktop-nav a',active=base+'[aria-current="page"]';
 const styles=[base+'{display:inline-flex!important;align-items:center!important;justify-content:center!important;min-height:38px!important;padding:8px 16px!important;transition:background .15s,color .15s!important}'];
 if(v==='1')styles.push(active+'{color:var(--color-ink)!important;background:transparent!important;font-weight:800!important}'+active+'::after{height:2px!important;left:8px!important;right:8px!important;width:auto!important;bottom:0!important;border-radius:2px!important;background:var(--color-ink)!important}');
 if(v==='2')styles.push(active+'{background:var(--color-ink)!important;color:var(--color-white)!important;border-radius:var(--radius-control)!important;font-weight:700!important}'+active+'::after{display:none!important}');
 if(v==='3')styles.push(active+'{background:var(--color-mint-tint)!important;color:var(--color-ink)!important;border:1px solid var(--color-glass-border)!important;border-radius:var(--radius-control)!important;font-weight:800!important}'+active+'::after{display:none!important}');
 const style=d.createElement('style');style.textContent=styles.join('\n');d.head.append(style);frame.classList.add('ready');
});
</script></html>
