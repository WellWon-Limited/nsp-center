<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Три варианта статуса товара</title><style>
@font-face{font-family:Manrope;src:url('/prototype/fonts/manrope-cyrillic.woff2') format('woff2');font-weight:400 800;font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#eaf3f1;color:#1d3a36;font:14px/1.5 Manrope,Arial,sans-serif;background-image:radial-gradient(at 0 0,rgba(164,217,201,.5),transparent 55%),radial-gradient(at 100% 60%,rgba(201,223,246,.5),transparent 55%)}main{max-width:1470px;margin:auto;padding:32px}h1{font-size:28px;line-height:1.2;margin:0 0 8px;letter-spacing:-.02em}header p{margin:0;color:#526e68}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:28px}.option-heading{display:flex;align-items:center;gap:12px;margin:0 0 12px;font-size:17px}.number{display:grid;place-items:center;flex:none;width:32px;height:32px;background:rgba(255,255,255,.6);border-radius:50%;font-size:13px}.card{border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.45);border-radius:26px;padding:12px}.photo{height:200px;background:rgba(255,255,255,.6);border-radius:20px;display:flex;align-items:center;justify-content:center}.photo img{width:165px;height:196px;object-fit:fill;mask-image:url('/images/products/package-clips/5-htp-power-1.svg');mask-size:100% 100%;mask-repeat:no-repeat}.content{padding:18px 12px 12px}h2{margin:0;font-size:24px;line-height:1.2;letter-spacing:-.02em}.meta{margin:8px 0 18px;font-size:12px;color:#526e68}.status{display:inline-flex;align-items:center;gap:9px;border-radius:999px;min-height:36px;padding:7px 14px;font-size:14px;font-weight:800;line-height:1.4}.status::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}.solid .status{background:#1d3a36;color:white}.outline .status{background:white;color:#1d3a36;border:1px solid #1d3a36}.sand .status{background:#f3dcb8;color:#1d3a36}.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0 0;padding:16px 0;border-block:1px solid rgba(29,58,54,.08)}.facts dt{font-size:12px;font-weight:700;color:#526e68}.facts dd{margin:4px 0 0;font-size:14px}.copy{margin:16px 0;color:#526e68;font-size:13px;min-height:59px}.price{font-size:28px;font-weight:800;line-height:1.2;margin:18px 0}.waitlist{display:flex;justify-content:center;align-items:center;min-height:48px;width:100%;border:1px solid #b9cfca;border-radius:14px;color:#1d3a36;background:white;font:700 13px Manrope,Arial,sans-serif}.note{margin:14px 4px;color:#526e68;font-size:13px}.note strong{color:#1d3a36}.footer{margin-top:18px;color:#526e68;font-size:12px}@media(max-width:900px){.grid{grid-template-columns:1fr}main{padding:20px}.photo{height:180px}.photo img{width:145px;height:172px}.copy{min-height:0}}
</style></head><body><main><header><h1>«Нет в наличии» — три варианта</h1><p>Увеличенный текст и контраст. Место статуса в карточке остаётся тем же.</p></header><div class="grid" id="options"></div><p class="footer">Предпросмотр вариантов. На самом сайте оформление пока сохранено.</p></main><script>
const variants=[{id:1,cls:'solid',name:'Тёмная плашка',note:'Самый заметный: белая надпись на тёмно-зелёном фоне.'},{id:2,cls:'outline',name:'Светлая с контуром',note:'Сдержанный: чёткий тёмный текст и тонкая зелёная рамка.'},{id:3,cls:'sand',name:'Тёплый бежевый',note:'Отличается от зелёного «В наличии», сохраняя цвета сайта.'}];document.querySelector('#options').innerHTML=variants.map(v=>`<section class="${v.cls}"><h3 class="option-heading"><span class="number">${v.id}</span>${v.name}</h3><article class="card"><div class="photo"><img src="/images/products/russian-source/5-htp-power-1.jpg" alt="5-Эйч-Ти-Пи Пауер — российская упаковка"></div><div class="content"><h2>5-Эйч-Ти-Пи Пауер</h2><p class="meta">БАД · Арт. 3088</p><span class="status">Нет в наличии</span><dl class="facts"><div><dt>Количество</dt><dd>60 капсул</dd></div><div><dt>Форма выпуска</dt><dd>Капсулы</dd></div></dl><p class="copy">Растительный комплекс с 5-гидрокситриптофаном, цинком и витамином B6.</p><p class="price">4 676 ₽</p><button class="waitlist" type="button">Сообщить о поступлении</button></div></article><p class="note">${v.note}</p></section>`).join('');
</script></body></html>
