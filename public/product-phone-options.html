<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Товар на телефоне — варианты</title><style>html,body{margin:0;width:100%;height:100%;background:#eaf3f1}iframe{display:block;width:100%;height:100%;border:0}#loading{position:fixed;inset:0;display:grid;place-items:center;font:16px Inter,sans-serif;color:#1d3a36;background:#eaf3f1}#loading[hidden]{display:none}</style></head><body><div id="loading">Открываем вариант…</div><iframe title="Страница товара на телефоне"></iframe><script>
const params=new URLSearchParams(location.search),variant=['1','2','3'].includes(params.get('variant'))?params.get('variant'):'1';
const names={'1':'01 · Единая карточка','2':'02 · Название перед фото','3':'03 · Отдельные блоки'};
document.title=names[variant];
const frame=document.querySelector('iframe');
frame.addEventListener('load',async()=>{
 try{
 const d=frame.contentDocument;if(!d)return;
 const boot=[...d.querySelectorAll('link[rel="modulepreload"]')].find(e=>e.href.includes('/boot-'));
 if(boot)await frame.contentWindow.eval('import('+JSON.stringify(boot.href)+')');
 for(let i=0;i<60&&!d.querySelector('.product-detail--nature');i++)await new Promise(r=>setTimeout(r,50));
 if(!d.querySelector('.product-detail--nature'))throw Error('Страница пока не загрузилась');
 d.documentElement.dataset.phoneProductPreview=variant;
 const style=d.createElement('style');
 const p='html[data-phone-product-preview] body #root .site-main .product-detail.product-detail--nature';
 const v=n=>p.replace('[data-phone-product-preview]','[data-phone-product-preview="'+n+'"]');
 style.textContent=`@layer typography-reference{
 ${p}{display:flex!important;flex-direction:column!important;gap:0!important;padding:0!important;min-height:0!important;height:auto!important;max-height:none!important;border:1px solid var(--color-glass-border)!important;overflow:hidden!important;border-radius:var(--radius-panel)!important;background:var(--color-white)!important}
 ${p} .product-gallery.panel{margin:0!important;border-radius:0!important;background:var(--color-white)!important}
 ${p} .main-product-image{height:226px!important;min-height:0!important;padding:16px!important;border-radius:0!important;background:var(--color-white)!important}
 ${p} .product-gallery-packshot .product-packshot-frame{width:min(76%,calc(186px * var(--packshot-ratio)))!important;height:auto!important;aspect-ratio:var(--packshot-ratio)!important}
 ${p} .product-purchase{display:flex!important;flex-direction:column!important;gap:14px!important;padding:20px!important;background:transparent!important}
 ${p} .product-title-row{text-align:left!important;width:100%!important;align-self:stretch!important;margin-inline:0!important;padding-inline:0!important}
 ${p} .product-title-row h1{text-align:left!important;font-size:24px!important;line-height:1.15!important;font-weight:700!important;letter-spacing:-.02em!important}
 ${p} .product-heading-meta{justify-content:flex-start!important;font-size:12px!important;line-height:21px!important;min-height:21px!important;gap:6px!important;margin-top:8px!important}
 ${p} .product-stock{font-size:12px!important;padding:5px 9px!important;line-height:1.5!important}
 ${p} .purchase-box.panel{padding:0 0 16px!important;margin:0!important;border:0!important;border-bottom:1px solid var(--color-ink-line)!important;background:transparent!important;box-shadow:none!important}
 ${p} .purchase-prices{padding-top:12px!important;gap:0!important}
 ${p} .price-row.current strong{font-size:28px!important;line-height:1.2!important;font-weight:700!important}
 ${p} .card-offer{padding:12px!important;font-size:13px!important;line-height:1.5!important;border-radius:var(--radius-12)!important;margin-top:12px!important}
 ${p} .purchase-actions{gap:10px!important;margin-top:14px!important;grid-template-columns:1fr 1fr!important}
 ${p} .purchase-actions>.btn{height:54px!important;min-height:54px!important;font-size:14px!important;line-height:1.35!important;white-space:normal!important}
 ${p} .product-purpose{font-size:15px!important;line-height:1.6!important;color:var(--color-body)!important;margin:0!important}
 ${p} .product-key-facts{display:grid!important;grid-template-columns:1fr 1fr!important;gap:12px!important;padding:0!important;border:0!important}
 ${p} .product-key-facts dt,${p} .product-short-section h2{font-size:13px!important;line-height:1.5!important;font-weight:600!important}
 ${p} .product-key-facts dd{font-size:15px!important;line-height:1.5!important;margin:4px 0 0!important}
 ${p} .product-short-section{padding:0!important;border:0!important}
 ${p} .product-short-section p{font-size:15px!important;line-height:1.6!important;margin:6px 0 0!important;max-height:none!important;display:block!important;overflow:visible!important}
 ${p} .product-fact-details{font-size:14px!important;line-height:1.5!important;min-height:36px!important;margin:4px 0 0!important}
 ${p} .product-plan-action{font-size:14px!important;line-height:1.5!important;min-height:44px!important;text-align:left!important}
 ${p} .fine-print{display:block!important;font-size:12px!important;line-height:1.5!important;margin:0!important}
 ${v('1')} .product-purchase{border-top:1px solid var(--color-ink-line)!important}
 ${v('2')}{background:var(--color-glass)!important;padding:12px!important;gap:0!important}
 ${v('2')} .product-title-row{padding:8px 8px 18px!important;order:-2!important}
 ${v('2')} .product-gallery{order:0!important}
 ${v('2')} .product-purchase{display:contents!important}
 ${v('2')} .product-purchase>.product-stock{order:-1!important;margin:0 8px 16px!important}
 ${v('2')} .product-purchase>.purchase-box{order:3!important;margin:14px 8px 0!important;width:calc(100% - 16px)!important}
 ${v('2')} .product-purchase>.product-purpose{order:5!important;margin:14px 8px 0!important}
 ${v('2')} .product-purchase>.product-key-facts{order:2!important;margin:14px 8px 0!important}
 ${v('2')} .product-purchase>.product-short-section{order:4!important;margin:14px 8px 0!important}
 ${v('2')} .product-purchase>.product-plan-action{order:6!important;margin:14px 8px 0!important}
 ${v('2')} .product-purchase>.fine-print{order:7!important;margin:14px 8px 8px!important}
 ${v('2')} .main-product-image{height:224px!important;border-radius:var(--radius-20)!important}
 ${v('2')} .product-purchase{padding:18px 8px 8px!important}
 ${v('3')}{border:0!important;background:transparent!important;overflow:visible!important;gap:16px!important}
 ${v('3')} .product-gallery.panel{border-radius:var(--radius-panel)!important;overflow:hidden!important}
 ${v('3')} .main-product-image{height:240px!important;border-radius:var(--radius-panel)!important}
 ${v('3')} .product-purchase{padding:20px!important;border-radius:var(--radius-panel)!important;background:var(--color-glass-selected)!important;border:1px solid var(--color-glass-border)!important}
 ${v('3')} .purchase-box.panel{padding:16px!important;background:var(--color-white)!important;border:0!important;border-radius:var(--radius-20)!important}
 ${v('3')} .purchase-prices{border:0!important;padding-top:0!important}
 ${v('3')} .purchase-actions{display:flex!important;flex-wrap:wrap!important}
 ${v('3')} .purchase-actions>:is(.btn,.cart-action-control){flex:1 1 100%!important;width:100%!important}
 }`;
 d.head.append(style);d.querySelector('.product-detail--nature')?.style.removeProperty('--product-available-height');
 document.querySelector('#loading').hidden=true;
 }catch(e){document.querySelector('#loading').textContent='Не удалось открыть вариант. Обновите страницу.';console.error(e)}
});
frame.src='/product/aloe-vera-juice/?phone-layout-preview='+variant+'&preview-version='+Date.now();
</script></body></html>
