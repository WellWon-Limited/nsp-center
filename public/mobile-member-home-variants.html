</style></head><body><header class="header"><a href="/" class="brand"><img src="/icons/icon.svg" alt=""><span>NSP<b> Center</b></span></a><div class="header-actions"><a href="/profile/" aria-label="Уведомления" data-icon="bell"></a><a href="/cart/" aria-label="Корзина" data-icon="bag"></a><a href="/catalog/" aria-label="Меню" data-icon="menu"></a></div></header><main id="content"></main><nav class="nav" aria-label="Навигация приложения"><a href="/" aria-label="Главная" data-icon="home"></a><a href="/catalog/" aria-label="Каталог" data-icon="grid"></a><a href="/consultation/" aria-label="Консультация" data-icon="message"></a><a href="/health/" aria-label="План" data-icon="pulse"></a><a href="/profile/" aria-label="Профиль" data-icon="user"></a></nav><script>
const paths={home:'<path d="m3 10 9-7 9 7v10h-6v-7H9v7H3Z"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',message:'<path d="M12 3C6.5 3 2 6.6 2 11c0 2.3 1.2 4.4 3.2 5.9L4.5 21l4.6-2.3c.9.2 1.9.3 2.9.3 5.5 0 10-3.6 10-8s-4.5-8-10-8Z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/>',pulse:'<path d="M2 12h5l3-8 4 16 3-8h5"/>',user:'<circle cx="12" cy="6.5" r="3.5"/><path d="M4 21v-1a8 7 0 0 1 16 0v1"/>',bell:'<path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 8 2.5 8h-17S6 15 6 9Z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/>',bag:'<path d="M4 7h16l-1 14H5Z"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/>',menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',chevron:'<path d="m9 5 7 7-7 7"/>',heart:'<path d="M20 5c-3-3-6-1-8 1-2-2-5-4-8-1-5 5 4 11 8 15 4-4 13-10 8-15Z"/>',book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2ZM4 21V5"/>'};

const plan=[['Омега-3 ПНЖК','08:00',true],['Хлорофилл жидкий','13:00',true],['Магний','20:00',false]];
const tasks=(timeline=false)=>plan.map(([name,time,done])=>'<label class="task">'+(timeline?'<time>'+time+'</time>':'')+'<input type="checkbox" '+(done?'checked':'')+' aria-label="Отметить '+name+'"><span class="text"><strong>'+name+'</strong><span class="small">'+(done?'Приём отмечен':'По вашему плану')+'</span></span>'+(!timeline?'<time>'+time+'</time>':'')+'</label>').join('');

const greeting='<h1 class="hello">Здравствуйте,<br><span id="first-name">Анна</span></h1>';
const photo='<div class="photo"><img src="/images/hero-photo-options/desktop-omega-white-v1.jpg" alt="Продукты NSP и белая эхинацея"><a href="/catalog/">Выбрать продукты '+icon('chevron')+'</a></div>';
const marathon='<a href="/health-marafon/" class="panel marathon" style="display:block"><div class="row"><h3>21 день заботы о себе</h3>'+icon('chevron')+'</div><p>Продолжите маленькие привычки</p>'+meter+'<span class="small">Пример: день 6 из 21</span></a>';
const tiles='<div class="two"><a class="tile" href="/diagnostic-test/">'+icon('pulse')+'<h3>Что подойдёт вам?</h3><p>Небольшой тест о ваших привычках</p><span class="link">Пройти тест '+icon('chevron')+'</span></a><a class="tile" href="/blog/">'+icon('book')+'<h3>Журнал о заботе</h3><p>Идеи для повседневной заботы</p><span class="link">Почитать '+icon('chevron')+'</span></a></div>';

const habit='<a class="habit" href="/health-marafon/"><div class="row"><span class="habit-label">Марафон заботы</span><span class="small">День 6 из 21</span></div><div class="row habit-title"><h2>Маленькие привычки</h2>'+icon('chevron')+'</div><div class="meter"><i style="width:28%"></i></div><span class="small">Задания на сегодня: 1 из 4</span></a>';
const test='<a class="test-banner" href="/diagnostic-test/"><div><h2>Что подойдёт именно вам?</h2><p>Пройдите тест и получите рекомендации</p></div><span class="test-arrow">'+icon('chevron')+'</span></a>';
const products='<a class="products-banner" href="/catalog/"><img src="/images/hero-photo-options/desktop-omega-white-v1.jpg" alt="Продукты NSP с белой эхинацеей"><span>Выбрать продукты '+icon('chevron')+'</span></a>';
let html=intro+daily+habit+test+products+'<div class="two"><a class="tile" href="/profile/">'+icon('heart')+'<h3>Избранное</h3><p>Сохранённые вами продукты</p></a><a class="tile" href="/blog/">'+icon('book')+'<h3>Журнал о заботе</h3><p>Время узнать что-то новое</p></a></div>';
html+='<div class="demo"><span>Вариант 0'+v+'</span><span>Пример плана, не данные аккаунта</span></div>';document.querySelector('#content').innerHTML=html;
try{const s=JSON.parse(localStorage.getItem('nsp-center:v1')||'null');if(s?.signedIn&&s?.account?.firstName)document.querySelector('#first-name').textContent=String(s.account.firstName).slice(0,40)}catch{}
document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=icon(e.dataset.icon));
document.querySelectorAll('.task input').forEach(e=>e.addEventListener('change',()=>{const n=[...document.querySelectorAll('.task input')].filter(e=>e.checked).length;document.querySelectorAll('.progress').forEach(e=>e.textContent='Отмечено '+n+' из 3');document.querySelectorAll('section .meter i').forEach(e=>e.style.width=n/3*100+'%');e.closest('.task').querySelector('.small').textContent=e.checked?'Приём отмечен':'По вашему плану'}));
document.querySelectorAll('.daystrip button').forEach(e=>e.addEventListener('click',()=>{document.querySelector('.daystrip .selected')?.classList.remove('selected');e.classList.add('selected')}));
</script></body></html>
