<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Карточка покупателя с дисконтной картой</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#eaf3f1;color:#1d3a36;font:13px/1.4 Manrope,Arial,sans-serif}.bar{height:42px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:rgba(255,255,255,.6);border-bottom:1px solid rgba(29,58,54,.08)}.bar small{color:#526e68}iframe{display:block;width:100%;height:calc(100% - 42px);border:0}</style></head><body><div class="bar"><strong>Покупатель вошёл · Дисконтная карта подключена</strong><small>Предпросмотр</small></div><iframe id="member-card" sandbox="allow-same-origin" title="Карточка товара для покупателя с картой"></iframe><script>
const frame=document.querySelector('#member-card');const id=new URLSearchParams(location.search).get('product')||'aloe-vera-juice';let ready=false,details=null;const waiters=[];
function apply(){if(!ready||!details)return;const doc=frame.contentDocument;Object.assign(doc.documentElement.dataset,{homeDesign:'d',catalogDesign:'1',aboutDesign:'1',phoneDesign:'1',homeLook:'8',revealDesign:'2'});const row=doc.querySelector('.price-row.current');if(!row)return;row.classList.add('price-row--partner');const amount=doc.createElement('strong');amount.setAttribute('aria-label','Цена по дисконтной карте');amount.textContent=new Intl.NumberFormat('ru-RU').format(details.card)+' ₽';const retail=doc.createElement('s');retail.className='price-was';retail.textContent=new Intl.NumberFormat('ru-RU').format(details.retail)+' ₽';row.replaceChildren(amount,retail);doc.querySelector('.card-offer')?.remove();doc.documentElement.style.setProperty('--site-header-height',doc.querySelector('.site-header').getBoundingClientRect().height+'px');waiters.splice(0).forEach(r=>r());}
window.showMemberPreview=data=>{details=data;apply();return ready?Promise.resolve():new Promise(r=>waiters.push(r))};frame.onload=()=>{ready=true;apply()};frame.src='/product/'+(/^[a-z0-9-]+$/.test(id)?id:'aloe-vera-juice')+'/';
</script></body></html>
