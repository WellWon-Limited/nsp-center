const variants=[
 {id:1,title:'Крупно по центру',description:'Заголовок 34 px в две строки. Светлая кнопка под ним, над баночками.',css:`.home-hero.home-hero--forest{padding-top:20px}.home-hero.home-hero--forest .hero-photo img{object-position:center top}.home-hero.home-hero--forest .hero-copy h1[aria-label]{text-align:center;margin:0 0 16px;line-height:1.1;letter-spacing:-.04em}.home-hero.home-hero--forest .hero-copy h1[aria-label] .hero-title-line{padding:0;margin:0;text-align:center;transform:none}.home-hero.home-hero--forest .hero-copy .ds-cluster{justify-content:center}.home-hero.home-hero--forest .hero-copy .btn--primary{font-size:15px;font-weight:600;line-height:1.2;gap:12px;min-height:44px;padding:10px 18px;width:auto}.home-hero.home-hero--forest .hero-copy .btn--primary svg{display:block;width:18px;height:18px;flex:none}.home-hero.home-hero--forest .hero-copy h1[aria-label]{font-size:34px}.home-hero.home-hero--forest .hero-copy .btn--primary{border-radius:999px}`},
 {id:2,title:'Заголовок в одну строку',description:'Одна строка по ширине фото. Кнопка с тонким контуром на свободном фоне.',css:`.home-hero.home-hero--forest{padding-top:20px}.home-hero.home-hero--forest .hero-photo img{object-position:center top}.home-hero.home-hero--forest .hero-copy h1[aria-label]{text-align:center;margin:0 0 16px;line-height:1.1;letter-spacing:-.04em}.home-hero.home-hero--forest .hero-copy h1[aria-label] .hero-title-line{padding:0;margin:0;text-align:center;transform:none}.home-hero.home-hero--forest .hero-copy .ds-cluster{justify-content:center}.home-hero.home-hero--forest .hero-copy .btn--primary{font-size:15px;font-weight:600;line-height:1.2;gap:12px;min-height:44px;padding:10px 18px;width:auto}.home-hero.home-hero--forest .hero-copy .btn--primary svg{display:block;width:18px;height:18px;flex:none}.home-hero.home-hero--forest .hero-copy h1[aria-label]{font-size:clamp(20px,6.65vw,27px);white-space:nowrap;letter-spacing:-.045em;margin:0}.home-hero.home-hero--forest .hero-copy h1[aria-label] .hero-title-line{display:inline}.home-hero.home-hero--forest .hero-copy .ds-cluster{margin-top:60px}.home-hero.home-hero--forest .hero-copy .btn--primary{color:#fff;background:rgba(9,24,14,.16);border:1px solid rgba(255,255,255,.8);border-radius:14px}`},
 {id:3,title:'Выразительный заголовок',description:'Заголовок ниже. Кнопка справа от белой баночки, над Омегой.',css:`.home-hero.home-hero--forest{padding-top:20px}.home-hero.home-hero--forest .hero-photo img{object-position:center top}.home-hero.home-hero--forest .hero-copy h1[aria-label]{text-align:center;margin:0 0 16px;line-height:1.1;letter-spacing:-.04em}.home-hero.home-hero--forest .hero-copy h1[aria-label] .hero-title-line{padding:0;margin:0;text-align:center;transform:none}.home-hero.home-hero--forest .hero-copy .ds-cluster{justify-content:center}.home-hero.home-hero--forest .hero-copy .btn--primary{font-size:15px;font-weight:600;line-height:1.2;gap:12px;min-height:44px;padding:10px 18px;width:auto}.home-hero.home-hero--forest .hero-copy .btn--primary svg{display:block;width:18px;height:18px;flex:none}.home-hero.home-hero--forest{padding-top:18px}.home-hero.home-hero--forest .hero-copy h1[aria-label]{font-size:38px;line-height:1.05;margin-bottom:20px}.home-hero.home-hero--forest .hero-copy .btn--primary{border-radius:12px;min-width:222px;justify-content:space-between}.home-hero.home-hero--forest{padding-top:42px}.home-hero.home-hero--forest .hero-copy{position:static}.home-hero.home-hero--forest .hero-copy .ds-cluster{position:absolute;top:min(33.4%,55.2vw);right:18px;left:auto;width:calc(50% - 9px);margin:0;z-index:3}.home-hero.home-hero--forest .hero-copy .btn--primary{width:100%;min-width:0;min-height:44px;padding:10px 8px;gap:6px;font-size:clamp(12px,3.48vw,14px);white-space:nowrap;justify-content:center}.home-hero.home-hero--forest .hero-copy .btn--primary svg{width:16px;height:16px}`}
];
const params=new URLSearchParams(location.search),chosen=Number(params.get('variant')),device=params.get('device'),single=variants.some(v=>v.id===chosen)&&['phone','laptop'].includes(device);
if(single){document.body.classList.add('single');document.querySelector('header>a').href='/hero-mobile-options-v2.html';document.querySelector('header>a').textContent='← Все три варианта';document.querySelector('h1').textContent=variants.find(v=>v.id===chosen).title}
const grid=document.querySelector('main');
const fit=box=>{const frame=box.querySelector('iframe'),w=Number(frame.dataset.width),h=Number(frame.dataset.height);let width=box.clientWidth;if(single){width=Math.min(w,innerWidth,((innerHeight-document.querySelector('header').offsetHeight)/h)*w);box.style.width=width+'px'}frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+width/w+')';box.style.height=(width*h/w+box.offsetWidth-box.clientWidth)+'px'};
(async()=>{try{
 const source=await(await fetch('/')).text();
 const clean=source.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,'').replace(/<html[^>]*>/i,'<html lang="ru">');
 if(single&&innerWidth<640){
  const v=variants.find(v=>v.id===chosen);
  const css='.nsp-launch,.install-banner,.install-banner-backdrop{display:none!important}'+v.css;
  let preview=clean.replace('</head>','<style>'+css+'</style></head>');
  try{const count=Number(localStorage.getItem('nsp-center:cart-count')||'0');if(Number.isSafeInteger(count)&&count>=0)preview=preview.replace('<html lang="ru">','<html lang="ru" data-cart-count="'+count+'" style="--header-cart-count:&quot;'+count+'&quot;">')}catch{}
  document.open();document.write(preview);document.close();return;
 }
 grid.innerHTML='';
 for(const v of single?variants.filter(v=>v.id===chosen):variants){
  const card=document.createElement('section');card.className='option';card.dataset.variant=v.id;
  card.innerHTML='<div class="option-head"><span class="number">'+v.id+'</span><div><h2>'+v.title+'</h2><p>'+v.description+'</p></div></div>';
  for(const kind of ['phone']){
   const phone=kind==='phone',w=phone?402:1470,h=phone?874:919;
   const label=document.createElement('div');label.className='label '+kind+'-label';label.textContent=phone?'Телефон':'Ноутбук';card.append(label);
   const box=document.createElement('div');box.className='screen '+kind;
   const iframe=document.createElement('iframe');iframe.title=v.title+' — '+label.textContent;iframe.dataset.width=w;iframe.dataset.height=h;
   const css=`html{scrollbar-width:none}::-webkit-scrollbar{display:none}.preview-phone-hardware{position:absolute;top:0;left:0;right:0;height:62px;z-index:200;pointer-events:none}.preview-phone-hardware span{position:absolute;left:28px;top:20px;font:600 15px Arial,sans-serif;color:#1d3a36}.preview-phone-hardware i{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:30px;background:#000}html:root{--site-header-height:123px;--phone-header-height:123px;--phone-first-screen-height:665px}body .site-header{padding-top:62px}.bottom-nav{padding-bottom:38px}.home-hero.home-hero--forest{min-height:665px}.nsp-launch,.install-banner,.install-banner-backdrop{display:none!important}`+v.css;
   iframe.srcdoc=clean.replace('</head>','<style>'+css+'</style></head>').replace('<body>','<body><div class="preview-phone-hardware" aria-hidden="true"><span>9:41</span><i></i></div>');box.append(iframe);card.append(box);
   iframe.addEventListener('load',async()=>{await iframe.contentDocument.fonts.ready;box.dataset.ready='true';fit(box)});
   
  }
  const links=document.createElement('div');links.className='links';links.innerHTML='<a href="?variant='+v.id+'&device=phone">Открыть крупнее</a>';card.append(links);grid.append(card);
 }
}catch(e){grid.innerHTML='<p class="loading">Не удалось загрузить. Обновите страницу.</p>'}})();
addEventListener('resize',()=>document.querySelectorAll('.screen').forEach(fit));
</script></body></html>
