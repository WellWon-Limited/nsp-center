<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Главная — широкая фотография</title><style>html,body{margin:0;height:100%;background:#eef3f0}iframe{display:block;width:100%;height:100%;border:0;visibility:hidden}iframe.ready{visibility:visible}</style><iframe id="site" src="/" title="Вариант главной страницы NSP Center"></iframe><script>
const variant=['1','2','3'].includes(new URLSearchParams(location.search).get('v'))?new URLSearchParams(location.search).get('v'):'1';
document.title=['','01 · Светлая панорама','02 · Глубина леса','03 · Светлая карточка'][variant];
const blend=['1','2','3'].includes(new URLSearchParams(location.search).get('blend'))?new URLSearchParams(location.search).get('blend'):'1';
if(variant==='2')document.title=['','01 · Мягкий горизонт','02 · Широкое растворение','03 · Воздушный край'][blend];
const frame=document.querySelector('iframe');
frame.addEventListener('load',()=>{
 const doc=frame.contentDocument;if(!doc)return;doc.documentElement.dataset.desktopHeroPreview=variant;
 const prefix='html[data-desktop-hero-preview] body ';
 const hero='.home-hero.home-hero--banner.home-hero--forest';
 const rules=[
 ['.site-main','padding-top:0!important'],
 ['.home-first-screen','min-height:calc(100svh - var(--site-header-height,80px))!important'],
 [hero,'display:block!important;position:relative!important;width:100vw!important;height:clamp(520px,64svh,650px)!important;min-height:0!important;max-height:none!important;margin:0 calc(50% - 50vw) 0!important;padding:0!important;overflow:visible!important;isolation:isolate'],
 [hero+' .hero-photo','position:absolute!important;inset:0!important;width:100%!important;height:100%!important;margin:0!important;grid-area:auto!important;border-radius:0!important;box-shadow:none!important;overflow:hidden!important;z-index:-1!important;-webkit-mask-image:linear-gradient(#000 0%,#000 68%,transparent 100%)!important;mask-image:linear-gradient(#000 0%,#000 68%,transparent 100%)!important'],
 [hero+' .hero-photo picture','display:block!important;background:none!important;width:100%!important;height:100%!important'],
 [hero+' .hero-photo img','display:block!important;content:normal!important;width:100%!important;max-width:none!important;height:100%!important;object-fit:cover!important;object-position:52% 50%!important;-webkit-mask:none!important;mask:none!important;transform:none!important'],
 [hero+' .hero-photo::before','content:""!important;display:block!important;position:absolute!important;inset:0!important;z-index:1!important;background:linear-gradient(90deg,#eef3f0f2 0%,#eef3f0e8 26%,#eef3f080 38%,transparent 55%)!important'],
 [hero+' .hero-copy','position:absolute!important;inset:48px auto auto max(5vw,28px)!important;margin:0!important;transform:none!important;max-width:440px!important;width:30vw!important;z-index:2!important'],
 [hero+' .hero-copy h1','font-size:clamp(44px,3.9vw,60px)!important;line-height:1.06!important'],
 [hero+' .hero-copy>p','font-size:17px!important;line-height:1.6!important;max-width:410px!important'],
 [hero+' .hero-copy .ds-cluster','gap:16px 20px!important'],
 [hero+' .hero-note','margin-top:20px!important'],
 [hero+'>.hero-daily','position:absolute!important;inset:auto max(5vw,28px) 30px auto!important;width:440px!important;max-width:40vw!important;margin:0!important;grid-area:auto!important;z-index:3!important;background:#ffffffed!important'],
 [hero+' .hero-daily p','white-space:normal!important;overflow:visible!important;text-overflow:clip!important'],
 ['.home-paths','position:relative!important;z-index:2!important;margin-top:8px!important'],
 ['.home-first-screen+.section','margin-top:0!important']
 ];
 const transitionMask=blend==='1'
 ? 'linear-gradient(#000 0%,#000 81%,rgba(0,0,0,.98) 85%,rgba(0,0,0,.88) 89%,rgba(0,0,0,.62) 93%,rgba(0,0,0,.25) 97%,transparent 100%)'
 : blend==='2'
 ? 'linear-gradient(#000 0%,#000 64%,transparent 100%),radial-gradient(ellipse 32% 76% at 48% 29%,#000 70%,rgba(0,0,0,.96) 77%,rgba(0,0,0,.7) 85%,rgba(0,0,0,.3) 93%,transparent 100%),radial-gradient(ellipse 20% 29% at 62% 66%,#000 48%,rgba(0,0,0,.85) 64%,rgba(0,0,0,.4) 83%,transparent 100%)'
 : 'linear-gradient(#000 0%,#000 72%,rgba(0,0,0,.94) 80%,rgba(0,0,0,.7) 88%,rgba(0,0,0,.3) 95%,transparent 100%),radial-gradient(ellipse 38% 64% at 49% 30%,#000 70%,rgba(0,0,0,.9) 78%,rgba(0,0,0,.5) 90%,transparent 100%)';
 if(variant==='2')rules.push(
 [hero+' .hero-photo','-webkit-mask-image:'+transitionMask+'!important;mask-image:'+transitionMask+'!important'],
 [hero+' .hero-photo::before','background:linear-gradient(90deg,#102b24ed 0%,#102b24d9 27%,#102b2470 40%,transparent 59%)!important'],
 [hero+' .hero-copy :is(h1,p,.hero-note,.hero-note strong,.hero-pill,.hero-secondary)','color:#fff!important'],
 [hero+' .hero-copy h1 .hero-title-line--end','color:#d7e9d7!important'],
 [hero+' .hero-note :is(.tiny-leaf,svg)','color:#fff!important'],
 [hero+' .hero-note svg','stroke:#fff!important'],
 [hero+' .hero-copy .btn--primary','background:#edf2df!important;border-color:#edf2df!important;color:#1d3a36!important']
 );
 if(variant==='3')rules.push(
 [hero+' .hero-photo','-webkit-mask-image:linear-gradient(#000 0%,#000 57%,transparent 100%)!important;mask-image:linear-gradient(#000 0%,#000 57%,transparent 100%)!important'],
 [hero+' .hero-photo::before','background:linear-gradient(90deg,#eef3f026,transparent 52%)!important'],
 [hero+' .hero-copy','top:30px!important;padding:26px 28px!important;width:calc(31vw + 30px)!important;max-width:465px!important;background:#f8fbf6ed!important;border-radius:28px!important;box-shadow:0 20px 55px -40px #173a324d!important'],
 [hero+' .hero-copy h1','font-size:clamp(42px,3.5vw,54px)!important'],
 [hero+' .hero-copy .hero-pill','margin-bottom:16px!important']
 );
 const style=doc.createElement('style');style.textContent=rules.map(([s,c])=>prefix+s+'{'+c+'}').join('\n');doc.head.append(style);
 if(variant==='2'){
  const copy=doc.querySelector('.hero-copy'),plan=doc.querySelector('.home-hero>.hero-daily');
  const alignPlan=()=>{if(!copy||!plan)return;plan.style.setProperty('top',(copy.offsetTop+(copy.offsetHeight-plan.offsetHeight)/2)+'px','important');plan.style.setProperty('bottom','auto','important')};
  alignPlan();const observer=new ResizeObserver(alignPlan);observer.observe(copy);observer.observe(plan);doc.fonts.ready.then(alignPlan);frame.contentWindow.addEventListener('resize',alignPlan);
 }
 frame.classList.add('ready');
});
</script></html>
