<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Три анимации заголовка</title><link rel="stylesheet" href="/fonts/hero-options/fonts.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ee;color:#1d3a36;font:14px Manrope,Arial,sans-serif}header{padding:22px 24px 18px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:24px;margin:0 0 6px;font-weight:600}header p{margin:0;color:#60756d;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:0 24px 24px}.option{background:white;border:1px solid #c7d4cc;border-radius:20px;padding:16px;min-width:0}.option h2{font-size:18px;margin:0 0 8px}.option p{color:#60756d;font-size:12px;line-height:1.5;margin:0;min-height:36px}.option-head{min-height:90px}.label{font-size:11px;color:#60756d;margin:14px 0 8px}.screen{position:relative;overflow:hidden;border:1px solid #c7d4cc;border-radius:10px;background:#fff}.screen iframe{display:block;border:0;transform-origin:0 0;pointer-events:none}.phone{width:242px;max-width:100%;margin:auto;border:3px solid #1d3a36;border-radius:25px}.phone-label{text-align:center}button{font:600 12px Manrope,Arial,sans-serif;padding:10px 16px;border:1px solid #1d3a36;color:#1d3a36;background:#fff;border-radius:12px;cursor:pointer}.replay{display:block;margin:16px auto 0}.status{font-size:12px;color:#60756d}a{color:inherit} @media(max-width:850px){.grid{grid-template-columns:1fr}.option{max-width:620px;width:100%;margin:auto}header{display:block}.phone{width:280px}}
</style></head><body><header><div><h1>Как может появляться заголовок</h1><p>Три варианта · в предпросмотре повторяются каждые 7 секунд</p></div><button id="all-replay">Повторить все</button></header><main class="grid"><p class="status">Подготавливаем предпросмотр…</p></main><script>
const variants=[{id:3,title:'3. Слова по очереди',description:'Сохранённый вариант: слова мягко поднимаются по очереди. Около 2,3 секунды.'},{id:4,title:'4. Лёгкий поворот слов',description:'Слова раскрываются с небольшим поворотом и плавно выравниваются. Около 1,6 секунды.'},{id:5,title:'5. Появление по буквам',description:'Буквы последовательно проявляются лёгкой волной. Около 1,5 секунды.'}];
const css=`html{scrollbar-width:none}::-webkit-scrollbar{display:none}body{overflow:hidden}.nsp-launch,.install-banner,.install-banner-backdrop{display:none!important}.motion-preview--1 .hero-title-line{animation:motion-soft 1.4s cubic-bezier(.2,.65,.2,1) both}.motion-preview--2 .hero-title-line{animation:motion-line 1.2s cubic-bezier(.2,.65,.2,1) both}.motion-preview--2 .hero-title-line--end{animation-delay:.22s}.motion-word{display:inline-block;white-space:pre}.motion-preview--3 .motion-word{animation:motion-word 1.5s cubic-bezier(.2,.65,.2,1) both;animation-delay:calc(var(--i)*.16s)}@keyframes motion-soft{from{opacity:0;transform:translateY(12px);filter:blur(3px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}@keyframes motion-line{from{opacity:0;clip-path:inset(100% 0 0);transform:translateY(9px)}to{opacity:1;clip-path:inset(0);transform:translateY(0)}}@keyframes motion-word{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.motion-preview--4 .motion-word{transform-origin:50% 100%;animation:motion-turn 1.1s cubic-bezier(.2,.65,.2,1) both;animation-delay:calc(var(--i)*.09s)}.motion-letter-word{display:inline-block;white-space:nowrap}.motion-char{display:inline-block}.motion-preview--5 .motion-char{animation:motion-letter .7s cubic-bezier(.2,.65,.2,1) both;animation-delay:calc(var(--i)*.024s)}@keyframes motion-turn{from{opacity:0;transform:perspective(600px) translateY(10px) rotateX(-35deg)}to{opacity:1;transform:perspective(600px) translateY(0) rotateX(0)}}@keyframes motion-letter{from{opacity:0;transform:translateY(5px);filter:blur(2px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}@media(prefers-reduced-motion:reduce){.motion-preview--1 .hero-title-line,.motion-preview--2 .hero-title-line,.motion-preview--3 .motion-word,.motion-preview--4 .motion-word,.motion-preview--5 .motion-char{animation:none!important}}`;
function render(source,id,phone,hardware){const doc=new DOMParser().parseFromString(source,'text/html');doc.querySelectorAll('script').forEach(s=>s.remove());const title=doc.querySelector('.hero-copy h1');title.classList.add('motion-preview--'+id);if([3,4,5].includes(id)){let n=0;title.querySelectorAll('.hero-title-line').forEach(line=>{const words=line.textContent.split(' ');line.textContent='';words.forEach((word,i)=>{const span=doc.createElement('span');span.className=id===5?'motion-letter-word':'motion-word';if(id===5){[...word].forEach(letter=>{const char=doc.createElement('span');char.className='motion-char';char.style.setProperty('--i',String(n++));char.textContent=letter;span.append(char)})}else{span.style.setProperty('--i',String(n++));span.textContent=word;}line.append(span);if(i<words.length-1)line.append(doc.createTextNode(' '))})})}const style=doc.createElement('style');style.textContent=css+(hardware?`html:root{--site-header-height:123px;--phone-header-height:123px;--phone-first-screen-height:665px}body .site-header{padding-top:62px}.bottom-nav{padding-bottom:38px}.home-hero.home-hero--forest{min-height:665px}.preview-hardware{position:absolute;top:0;left:0;right:0;height:62px;z-index:200;pointer-events:none}.preview-hardware span{position:absolute;left:28px;top:20px;font:600 15px Arial;color:#1d3a36}.preview-hardware i{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:30px;background:#000}`:'');doc.head.append(style);if(hardware){const hw=doc.createElement('div');hw.className='preview-hardware';hw.setAttribute('aria-hidden','true');hw.innerHTML='<span>9:41</span><i></i>';doc.body.prepend(hw)}return '<!doctype html>'+doc.documentElement.outerHTML}
const replay=scope=>{scope.querySelectorAll('iframe').forEach(frame=>{const d=frame.contentDocument;if(!d)return;d.querySelector('.hero-copy h1')?.getAnimations({subtree:true}).forEach(a=>{a.currentTime=0;a.play()})})};
const fit=box=>{const f=box.querySelector('iframe'),w=Number(f.dataset.w),h=Number(f.dataset.h),scale=box.clientWidth/w;f.style.width=w+'px';f.style.height=h+'px';f.style.transform='scale('+scale+')';box.style.height=(h*scale)+'px'};
(async()=>{try{const source=await(await fetch('/')).text();const params=new URLSearchParams(location.search),selected=Number(params.get('variant'));if(variants.some(v=>v.id===selected)&&innerWidth<640){document.open();document.write(render(source,selected,true,false));document.close();setInterval(()=>document.querySelector('.hero-copy h1')?.getAnimations({subtree:true}).forEach(a=>{a.currentTime=0;a.play()}),7000);return}const grid=document.querySelector('.grid');grid.innerHTML='';for(const v of variants){const card=document.createElement('section');card.className='option';card.innerHTML='<div class="option-head"><h2>'+v.title+'</h2><p>'+v.description+'</p></div>';for(const phone of [false,true]){const label=document.createElement('div');label.className='label'+(phone?' phone-label':'');label.textContent=phone?'Телефон':'Ноутбук';card.append(label);const box=document.createElement('div');box.className='screen '+(phone?'phone':'laptop');const f=document.createElement('iframe');f.title=v.title+' — '+label.textContent;f.dataset.w=phone?402:1470;f.dataset.h=phone?874:919;f.srcdoc=render(source,v.id,phone,phone);f.onload=async()=>{await f.contentDocument.fonts.ready;fit(box);replay(card)};box.append(f);card.append(box)}const button=document.createElement('button');button.className='replay';button.textContent='Повторить';button.onclick=()=>replay(card);card.append(button);grid.append(card)}document.querySelector('#all-replay').onclick=()=>replay(document);setInterval(()=>replay(document),7000);addEventListener('resize',()=>document.querySelectorAll('.screen').forEach(fit))}catch(error){document.querySelector('.grid').textContent='Не удалось открыть предпросмотр. Обновите страницу.';console.error(error)}})();
</script></body></html>
