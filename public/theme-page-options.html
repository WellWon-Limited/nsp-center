<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Варианты тематической страницы</title><style>html,body{margin:0;width:100%;height:100%;background:#eaf3f1}iframe{display:block;border:0;width:100%;height:100%;opacity:0}iframe.ready{opacity:1}</style></head><body><iframe title="Тематическая страница — вариант оформления"></iframe><script>
(()=>{

 const frame=document.querySelector('iframe');
 const css=`

 html[data-theme-preview] body #root .theme-paper .theme-sources{margin-top:28px !important}
 html[data-theme-preview] body #root .theme-paper>.fine-print{margin:24px 0 0 !important;font-size:12px!important;color:var(--color-muted)!important}
 html[data-theme-preview="2"] body #root .paper-reading{max-width:800px !important;margin:0 auto !important}
 html[data-theme-preview="2"] body #root .paper-support{padding-top:32px !important}

 @media(max-width:959px){
 html[data-theme-preview] body #root .site-main{width:calc(100% - 36px)!important;padding-top:18px!important}
 html[data-theme-preview] body #root .theme-paper{padding:24px 20px !important;border-radius:26px !important}
 html[data-theme-preview] body #root .paper-grid{grid-template-columns:minmax(0,1fr) !important;gap:20px !important}
 html[data-theme-preview] body #root .paper-grid>.paper-products{position:static !important}
 html[data-theme-preview] body #root .theme-hero h1{font-size:28px!important}
 html[data-theme-preview] body #root .theme-paper .theme-section p,html[data-theme-preview] body #root .theme-paper .theme-lead{font-size:15px!important;line-height:1.65!important}
 html[data-theme-preview="3"] body #root .paper-product-strip{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
 }
 @media(max-width:599px){
 html[data-theme-preview="3"] body #root .paper-product-strip{grid-template-columns:minmax(0,1fr) !important}
 html[data-theme-preview] body #root .paper-products .theme-cards{grid-template-columns:minmax(0,1fr) !important}
 }
 }
 @layer typography-reference{
 html[data-theme-preview="1"] body #root .paper-support>.theme-cards-section>h2{text-align:center!important}
 html[data-theme-preview="1"] body #root .paper-support>.theme-cards-section>.theme-cards{margin-inline:auto!important}
 html[data-theme-preview="1"] body #root .theme-paper .theme-bundle{max-width:936px!important;margin:24px auto 0!important;background:var(--color-ink)!important;color:var(--color-white)!important;border:0!important;border-radius:28px!important;padding:24px 28px!important}

 html[data-theme-preview="1"] body #root .theme-bundle>div span{color:var(--color-on-dark-muted)!important}
 html[data-theme-preview="1"] body #root .theme-bundle .btn--primary{background:var(--color-white)!important;color:var(--color-ink)!important;border-color:var(--color-white)!important}
 html[data-theme-preview="1"] body #root .theme-paper .theme-faq{width:100%!important;max-width:800px!important;margin:32px auto 0!important}
 html[data-theme-preview="1"] body #root .theme-paper .theme-faq>h2{text-align:center!important;margin-bottom:20px!important}
 html[data-theme-preview="1"] body #root .theme-paper .theme-faq summary{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:20px!important;list-style:none!important}
 html[data-theme-preview="1"] body #root .theme-paper .theme-faq summary::-webkit-details-marker{display:none!important}
 html[data-theme-preview="1"] body #root .theme-paper .theme-faq summary::after{content:""!important;display:block!important;flex:none!important;width:8px!important;height:8px!important;margin-right:4px!important;border-right:2px solid currentColor!important;border-bottom:2px solid currentColor!important;transform:rotate(-45deg)!important}
 html[data-theme-preview="1"] body #root .theme-paper .theme-faq details[open]>summary::after{transform:rotate(45deg)!important}
}
@layer typography-reference{
 html[data-theme-preview="1"][data-theme-section] body #root .paper-support>.theme-cards-section>h2{width:100%;max-width:936px;margin:0 auto 20px!important;text-align:left!important}
 html[data-theme-preview="1"][data-theme-section] body #root .theme-paper .theme-faq{width:100%!important;max-width:936px!important;margin:32px auto 0!important}
 html[data-theme-preview="1"][data-theme-section] body #root .theme-paper .theme-faq>h2{text-align:left!important;margin-bottom:16px!important}
 html[data-theme-preview="1"][data-theme-section] body #root .theme-paper .theme-faq details.panel{border:0!important;border-radius:22px!important;padding:18px 24px!important;background:var(--color-white)!important;box-shadow:0 18px 40px -32px rgb(29 58 54 / .45)!important;margin:0 0 10px!important}
 html[data-theme-preview="1"][data-theme-section] body #root .theme-paper .theme-faq summary{display:list-item!important;list-style:disclosure-closed inside!important;font-size:15px!important;font-weight:700!important}
 html[data-theme-preview="1"][data-theme-section] body #root .theme-paper .theme-faq details[open]>summary{list-style-type:disclosure-open!important}
 html[data-theme-preview="1"][data-theme-section] body #root .theme-paper .theme-faq summary::-webkit-details-marker{display:inline!important}
 html[data-theme-preview="1"][data-theme-section] body #root .theme-paper .theme-faq summary::after{display:none!important;content:none!important}
 html[data-theme-preview="1"][data-theme-section="2"] body #root .paper-support>.theme-cards-section{padding:24px 0!important;background:var(--color-ink-soft)!important;border-radius:26px!important}
 html[data-theme-preview="1"][data-theme-section="2"] body #root .theme-paper .theme-bundle{margin-top:28px!important}
 html[data-theme-preview="1"][data-theme-section="3"] body #root .pair-reason{margin:0 4px!important;padding:12px 16px!important;border:1px solid var(--color-glass-border)!important;border-radius:14px!important;background:var(--color-glass)!important;color:var(--color-ink)!important}
 html[data-theme-preview="1"][data-theme-section="3"] body #root .pair-reason summary{display:flex!important;align-items:center!important;justify-content:space-between!important;font-size:14px!important;font-weight:700!important;cursor:pointer!important;list-style:none!important}
 html[data-theme-preview="1"][data-theme-section="3"] body #root .pair-reason summary::-webkit-details-marker{display:none!important}
 html[data-theme-preview="1"][data-theme-section="3"] body #root .pair-reason summary::after{content:""!important;display:block!important;width:7px!important;height:7px!important;border-bottom:2px solid currentColor!important;border-right:2px solid currentColor!important;transform:rotate(45deg)!important}
 html[data-theme-preview="1"][data-theme-section="3"] body #root .pair-reason[open]>summary::after{transform:rotate(225deg)!important}
 html[data-theme-preview="1"][data-theme-section="3"] body #root .pair-reason>p{margin:12px 0 0!important;padding:0!important;border:0!important;font-size:14px!important;line-height:1.6!important}
 @media(max-width:959px){html[data-theme-preview="1"][data-theme-section="2"] body #root .paper-support>.theme-cards-section{padding:20px 12px!important}}
}
@layer typography-reference{
 html[data-theme-preview="1"] body #root .site-main{width:min(calc(100% - 56px),1000px)!important;max-width:1000px!important}
 html[data-theme-preview="1"] body #root .theme-paper{padding:32px!important}
 html[data-theme-preview="1"] body #root .paper-grid{gap:32px!important}
 html[data-theme-preview="1"] body #root .paper-support>.theme-cards-section>.theme-cards{max-width:936px!important}
 @media(max-width:959px){
  html[data-theme-preview="1"] body #root .site-main{width:calc(100% - 36px)!important}
  html[data-theme-preview="1"] body #root .theme-paper{padding:24px 20px!important}
 }
}
`;
 frame.onload=async()=>{
  const d=frame.contentDocument,w=frame.contentWindow;
  for(let i=0;i<150&&!d.querySelector('#root[data-hydrated="true"]');i++)await new Promise(r=>setTimeout(r,20));
  await d.fonts.ready;await new Promise(r=>setTimeout(r,100));
  d.querySelector('.install-banner-close')?.click();
  const article=d.querySelector('.theme-page');if(!article){frame.classList.add('ready');return}
  d.documentElement.dataset.themePreview=String(variant);
  if(section)d.documentElement.dataset.themeSection=String(section);
  const style=d.createElement('style');style.textContent=css;d.head.append(style);
  const header=article.querySelector('.theme-hero'),lead=header.querySelector('.theme-lead'),main=article.querySelector('.theme-cards-section--main'),pairs=article.querySelector('.theme-cards-section:not(.theme-cards-section--main)'),sections=[...article.querySelectorAll(':scope>.theme-section')],faq=article.querySelector('.theme-faq'),sources=article.querySelector('.theme-sources'),fine=article.querySelector(':scope>.fine-print');
  const paper=d.createElement('div');paper.className='theme-paper';paper.dataset.dsId='theme-paper';
  const reading=d.createElement('div');reading.className='paper-reading';
  const support=d.createElement('div');support.className='paper-support';
  main?.classList.add('paper-products');
  if(variant===1){
   reading.append(lead,...sections);
   const grid=d.createElement('div');grid.className='paper-grid';grid.append(reading);if(main)grid.append(main);paper.append(grid);
   if(pairs)support.append(pairs);
  }else if(variant===2){
   reading.append(lead,...sections);paper.append(reading);if(main)support.append(main);if(pairs)support.append(pairs);
  }else{
   const intro=d.createElement('div');intro.className='paper-intro';intro.append(lead);paper.append(intro);
   const title=d.createElement('h2');title.className='paper-product-heading';title.textContent='Продукты в материале';paper.append(title);
   const strip=d.createElement('div');strip.className='paper-product-strip';if(main?.querySelector('.product-card'))strip.append(main.querySelector('.product-card'));
   if(pairs)strip.append(...pairs.querySelectorAll('.theme-card-with-note'));paper.append(strip);
   const bundle=pairs?.querySelector('.theme-bundle');if(bundle)paper.append(bundle);
   reading.append(...sections);paper.append(reading);main?.remove();pairs?.remove();
  }
  if(faq)support.append(faq);if(sources)support.append(sources);paper.append(support);if(fine)paper.append(fine);article.append(paper);
  if(section===3){for(const p of support.querySelectorAll('.theme-card-with-note>p')){const details=d.createElement('details');details.className='pair-reason';const summary=d.createElement('summary');summary.textContent='Зачем?';p.querySelector('strong')?.remove();p.replaceWith(details);details.append(summary,p);}}
  w.scrollTo({top:0,behavior:'instant'});frame.classList.add('ready');window.previewReady=true;
  if(section)w.requestAnimationFrame(()=>w.scrollTo({top:support.getBoundingClientRect().top+w.scrollY-24,behavior:'instant'}));
 };
 frame.src='/temy/sok-aloe-vera/?theme-preview='+variant;
})();
</script></body></html>
