<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Строка консультации — три варианта</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ee;color:#1d3a36;font-family:Arial,sans-serif}main{max-width:1550px;padding:30px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:28px;letter-spacing:-.04em;margin:0 0 10px}p{font-size:14px;line-height:1.6;margin:0;color:#52645e}a{color:inherit;font-size:13px}nav{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0 16px}nav button{font:inherit;font-size:14px;border:1.5px solid #1d3a36;border-radius:30px;background:white;color:#1d3a36;padding:13px 20px;cursor:pointer}nav button[aria-pressed=true]{background:#1d3a36;color:white}button:focus-visible{outline:2px solid #ad6338;outline-offset:4px}.description{min-height:48px;max-width:850px}.views{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,.34fr);gap:28px;align-items:start;margin-top:22px}.view>p{margin-bottom:10px;font-size:12px}.screen{width:100%;position:relative;overflow:hidden;border:1px solid #c8cec5;border-radius:18px;background:white;box-shadow:0 12px 32px #1d3a3612}iframe{position:absolute;top:0;left:0;border:0;transform-origin:top left;background:white}.note{margin-top:22px;font-size:12px}@media(max-width:760px){main{padding:20px}header{display:block}header a{display:inline-block;margin-top:16px}.views{grid-template-columns:1fr}.view:last-child{max-width:360px;margin:auto;width:100%}h1{font-size:25px}}
</style></head><body><main><header><div><h1>Как оформить строку вопроса</h1><p>Три варианта в текущей консультации. Можно переключать и пробовать вводить текст.</p></div><a href="/consultation/">Открыть текущую консультацию ↗</a></header><nav aria-label="Варианты оформления"><button aria-pressed="true" data-option="outline">01 · Чёткий контур</button><button aria-pressed="false" data-option="sage">02 · Мягкий зелёный</button><button aria-pressed="false" data-option="panel">03 · Панель сообщения</button></nav><p class="description" id="description"></p><div class="views"><section class="view"><p>НОУТБУК</p><div class="screen" data-width="1280" data-height="820"><iframe title="Консультация на ноутбуке" src="/consultation/?input-preview=laptop"></iframe></div></section><section class="view"><p>ТЕЛЕФОН</p><div class="screen" data-width="402" data-height="874"><iframe title="Консультация на телефоне" src="/consultation/?input-preview=phone"></iframe></div></section></div><p class="note">Это варианты для выбора. Строка в основной консультации пока не изменена.</p></main><script>
const variants={
outline:{text:'Белое поле с чёткой тёмно-зелёной рамкой. Кнопка отправки — в том же зелёном цвете. Рекомендую этот вариант: строка заметна и сочетается с контурами остальных блоков.',css:'.chat-input{border:1.5px solid var(--color-ink);background:#fff;box-shadow:0 6px 22px #1d3a3612;padding:8px 8px 8px 20px}.chat-input:focus-within{outline:2px solid var(--color-ink);outline-offset:3px}.chat-input input::placeholder{color:#52645e;opacity:1}.chat-send:disabled{opacity:1;background:#e4eae3;color:#52645e}'},
sage:{text:'Светло-зелёное поле с тёмным контуром и более спокойными углами. Цвет отделяет строку от фона переписки.',css:'.chat-input{border:1.5px solid var(--color-ink);background:#e4eae3;border-radius:18px;box-shadow:0 6px 22px #1d3a3612;padding:10px 10px 10px 20px}.chat-input:focus-within{outline:2px solid var(--color-ink);outline-offset:3px}.chat-input input::placeholder{color:#52645e;opacity:1}.chat-send{border-radius:12px}.chat-send:disabled{opacity:1;background:white;color:#52645e}'},
panel:{text:'Отдельная белая панель с подписью «Ваш вопрос» и рамкой. Больше места для сообщения, кнопка отправки остаётся справа.',css:'.chat-input{border:1.5px solid var(--color-ink);background:#fff;border-radius:24px;padding:30px 10px 10px 20px;box-shadow:0 8px 26px #1d3a3620}.chat-input::before{content:"Ваш вопрос";position:absolute;left:20px;top:10px;color:var(--color-ink);font-size:11px;font-weight:600}.chat-input:focus-within{outline:2px solid var(--color-ink);outline-offset:3px}.chat-input input::placeholder{color:#52645e;opacity:1}.chat-send:disabled{opacity:1;background:#e4eae3;color:#52645e}.chat-log{padding-bottom:112px}.chat-down{margin-bottom:24px}'}
};let chosen='outline';
function apply(){document.getElementById('description').textContent=variants[chosen].text;document.querySelectorAll('iframe').forEach(frame=>{try{const doc=frame.contentDocument;if(!doc?.head)return;let style=doc.getElementById('input-option');if(!style){style=doc.createElement('style');style.id='input-option';doc.head.append(style)}style.textContent=variants[chosen].css;}catch{}})}
function fit(){document.querySelectorAll('.screen').forEach(screen=>{const width=Number(screen.dataset.width),height=Number(screen.dataset.height),scale=screen.clientWidth/width,frame=screen.querySelector('iframe');screen.style.height=height*scale+'px';frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform='scale('+scale+')';})}
document.querySelectorAll('nav button').forEach(button=>button.addEventListener('click',()=>{chosen=button.dataset.option;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));apply()}));document.querySelectorAll('iframe').forEach(frame=>frame.addEventListener('load',apply));new ResizeObserver(fit).observe(document.querySelector('.views'));fit();apply();
</script></body></html>
