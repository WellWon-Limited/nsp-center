const iframe=document.querySelector('iframe');iframe.onload=()=>{const f=iframe.contentDocument,form=f.querySelector('form.application-form');const phone=form.querySelector('[name=phone]');if(phone){phone.addEventListener('input',()=>{let raw=phone.value.trim(),digits=raw.replace(/\D/g,'');if(raw.startsWith('+7')||(!raw.startsWith('(')&&/^[78]/.test(digits)))digits=digits.slice(1);digits=digits.slice(0,10);phone.value=digits?'('+digits.slice(0,3)+(digits.length>3?') '+digits.slice(3,6):'')+(digits.length>6?'-'+digits.slice(6,8):'')+(digits.length>8?'-'+digits.slice(8,10):''):'';phone.setCustomValidity('')});phone.addEventListener('blur',()=>phone.setCustomValidity(phone.value.replace(/\D/g,'').length===10?'':'Введите телефон полностью: 10 цифр после +7.'))}let step=0;const show=()=>{f.querySelectorAll('[data-step]').forEach((e,i)=>e.hidden=i!==step);f.querySelectorAll('.application-steps li').forEach((e,i)=>{if(i===step)e.setAttribute('aria-current','step');else e.removeAttribute('aria-current')});form.querySelector('.application-prev').hidden=step===0;form.querySelector('.application-next').hidden=step===2;form.querySelector('.application-submit').hidden=step!==2;};if(v==='2'){form.querySelector('.application-next').onclick=()=>{const fields=[...form.querySelectorAll(`[data-step="${step}"] input`)];if(!fields.every(e=>e.reportValidity()))return;step++;if(step===2){const dl=form.querySelector('dl');dl.replaceChildren();for(const input of form.querySelectorAll('input:not([type=checkbox])')){const dt=f.createElement('dt'),dd=f.createElement('dd');dt.textContent=input.closest('label').firstChild.textContent;dd.textContent=input.value||'Не указано';dl.append(dt,dd)}}show()};form.querySelector('.application-prev').onclick=()=>{step--;show()};show()}form.onsubmit=e=>{e.preventDefault();form.innerHTML='<div class="application-complete"><p class="application-eyebrow">ПРЕДПРОСМОТР</p><h2>Так будет выглядеть отправленная заявка</h2><p>После настоящей отправки здесь появится статус оформления карты.</p><p class="application-muted">Сейчас это макет. Данные не сохранены и не отправлены сотруднику или в NSP.</p><button class="btn btn--primary" type="button" onclick="location.reload()">Вернуться к анкете</button></div>'}};
