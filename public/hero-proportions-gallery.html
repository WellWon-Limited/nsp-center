<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Новые фото для главной — пропорции упаковок</title><style>html,body{margin:0;min-height:100%;background:#eaf3f1;color:#1d3a36;font-family:Arial,sans-serif}body.single{height:100vh;display:grid;place-items:center;overflow:hidden}.single img{display:block;width:100%;height:100%;object-fit:contain}.gallery{display:grid;gap:40px;padding:24px}.gallery figure{margin:0}.gallery img{display:block;width:100%;height:auto}.gallery figcaption{font-size:18px;margin-bottom:12px}</style><main></main><script>
const names=['Мятный лес','Папоротники у ручья','Сад в оттенках шалфея','Светлая берёзовая роща','Мягкое утро'],files=['01-mint-forest','02-fern-stream','03-sage-garden','04-birch-light','05-soft-morning'];
const v=Number(new URLSearchParams(location.search).get('v')),main=document.querySelector('main');
if(v>=1&&v<=5){document.body.className='single';main.style.display='contents';document.title=`${v} · ${names[v-1]}`;const img=document.createElement('img');img.src=`/images/hero-proportions-2026-11-13/${files[v-1]}.png`;img.alt=`Вариант ${v}: ${names[v-1]}. Хлорофилл и Омега с пропорциями по оригинальным упаковкам`;main.append(img)}else{main.className='gallery';files.forEach((file,i)=>{const f=document.createElement('figure'),c=document.createElement('figcaption'),img=document.createElement('img');c.textContent=`${i+1}. ${names[i]}`;img.src=`/images/hero-proportions-2026-11-13/${file}.png`;img.alt=names[i];f.append(c,img);main.append(f)})}
</script></html>
