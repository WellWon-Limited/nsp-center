const d=frame.contentDocument;if(!d)return;

const find=d.createElement('button');find.className='detail-composition-link';find.type='button';find.textContent='Состав, применение и ограничения ›';find.addEventListener('click',()=>{d.querySelector('#tab-properties')?.click();d.querySelector('.product-content')?.scrollIntoView({behavior:'smooth',block:'start'})});facts.after(find);

if(v===2){
put('.product-detail','grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,.9fr);gap:var(--space-24)');
put('.main-product-image','height:410px;--packshot-target:310px;padding:var(--space-18)');
put('.main-product-image .product-packshot-frame','width:min(100%,calc(310px * var(--packshot-ratio)))');
put('.product-title-row h1','font-size:var(--text-28)');
put('.detail-key-facts','grid-template-columns:1fr;gap:var(--space-14);padding:var(--space-16) 0');
