<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Примеры шаблонов контента</title></head><body><p>Открываем пример…</p><script>
(async()=>{
 const screen=new URLSearchParams(location.search).get('screen')||'offers';
 const originalFetch=window.fetch.bind(window);
 const base=await (await originalFetch('/api/site')).json();
 const article={id:'custom-900001',contentId:900001,custom:true,path:'/blog/primer-zaboty/',url:'/blog/primer-zaboty/',title:'Маленькие привычки для заботы о себе',date:'14 ноября 2026 г.',description:'С чего начать и как найти свой удобный ритм.',image:'/images/journal-final/magnesium-cover-v1.jpg',images:[],body:'',html:'<p>Забота о себе начинается с небольших, понятных шагов. Выберите привычки, которым удобно следовать каждый день.</p><h2>Начните с простого</h2><p>Регулярное питание, отдых и движение помогают выстроить повседневный ритм. Меняйте привычки постепенно и обращайте внимание на своё самочувствие.</p><h2>План под ваш ритм</h2><p>Сохраняйте выбранные продукты в плане приёма. Состав и рекомендации по применению можно посмотреть в карточке каждого товара.</p>',related:['/product/alfalfa/','/product/aloe-vera-juice/'],source:{raw:'',markdown:''},data:{title:'Маленькие привычки для заботы о себе',lead:'С чего начать и как найти свой удобный ритм.',body:'Пример статьи',cover:'/images/journal-final/magnesium-cover-v1.jpg',date:'2026-11-14',products:['alfalfa','aloe-vera-juice']}};
 const fixture={...base,content:{...base.content,promos:[{id:900001,title:'Подборка для ежедневной заботы',text:'Пример оформления акции. Здесь администратор укажет условия предложения, а ниже выберет участвующие товары. Цены и наличие берутся из каталога.',from:'',to:'2026-12-31',image:'',link:'',products:['aloe-vera-juice','alfalfa','bee-pollen','omega-3-epa']}],photos:[{id:900001,image:'/images/journal-final/magnesium-cover-v1.jpg',caption:'Природа и ежедневная забота'},{id:900002,image:'/images/journal-final/summer-cover-v4.jpg',caption:'Сезонные привычки'},{id:900003,image:'/images/journal-final/vitamin-c-cover-v4.jpg',caption:'Внимание к простым деталям'}],articles:[article]}};
 let newProduct;
 if(screen==='knowledge-product'||screen==='recommend'){
  const page=await (await originalFetch('/product/alfalfa/')).text();const payload=JSON.parse(page.match(/<script type="application\/json" id="nsp-page-data">([\s\S]*?)<\/script>/)[1]);
  newProduct={...payload.product,id:'preview-alfalfa',path:'/product/preview-alfalfa/',url:'/product/preview-alfalfa/',name:'Люцерна — новый товар',custom:true,hidden:false};
  fixture.extraProducts=[...(fixture.extraProducts??[]),newProduct];fixture.visibility={...fixture.visibility,'preview-alfalfa':false};
  const ref=payload.product.experts?.[0]??{course:'Материалы о питании',lecture:'Растительные продукты в рационе',speaker:''};
  fixture.knowledge={...fixture.knowledge,'preview-alfalfa':{about:payload.product.copy.about,highlights:payload.product.copy.highlights,benefit:'Растительная питательная поддержка',recommendations:[{area:'nutrition',reason:'Растительные питательные вещества для поддержки рациона.'}],pairs:payload.productThemes?.[0]?.pairs??[{productId:'bee-pollen',why:'Пищевая поддержка рациона.'}],sources:[{id:'preview-source',course:ref.course,lecture:ref.lecture,speaker:ref.speaker}]}};
 }
 const path=screen==='photos'?'/photo/':screen==='article'?article.path:screen==='product'?'/product/aloe-vera-juice/':screen==='knowledge-product'?newProduct.path:screen==='recommend'?'/diagnostic-test/':screen==='waitlist'?'/catalog/?view=products&q=5-HTP':screen==='cart'?'/cart/':'/shares/';
 const source=screen==='article'?'/blog/interesnye-fakty-pro-magniy/':screen==='knowledge-product'?'/product/alfalfa/':path;
 let html=await (await originalFetch(source+(source.includes('?')?'&':'?')+'template-source=1')).text();
 const setup=`(()=>{history.replaceState(null,'',${JSON.stringify(path+(path.includes('?')?'&':'?')+'content-demo=1')});window.__contentPreview=${JSON.stringify(screen)};const fixture=${JSON.stringify(fixture).replace(/</g,'\\u003c')};const originalFetch=window.fetch.bind(window);const previewSession={account:{firstName:'Анна',lastName:'',email:'preview@example.ru',phone:'',partnerId:'',createdAt:'2026-11-14'},data:{cart:${JSON.stringify(screen==='cart'?{'aloe-vera-juice':1,'bee-pollen':2}:{})}}};window.fetch=(input,init)=>{const url=new URL(typeof input==='string'?input:input.url||String(input),location.href);if(${JSON.stringify(['waitlist','cart'].includes(screen))}&&(url.pathname==='/api/auth/me'||url.pathname==='/api/account'))return Promise.resolve(new Response(JSON.stringify(previewSession),{status:200,headers:{'Content-Type':'application/json'}}));if(url.pathname==='/api/site')return Promise.resolve(new Response(JSON.stringify(fixture),{status:200,headers:{'Content-Type':'application/json'}}));return originalFetch(input,init)};const get=Storage.prototype.getItem,set=Storage.prototype.setItem,remove=Storage.prototype.removeItem;Storage.prototype.getItem=function(k){if(k==='nsp-center:recommend'&&${JSON.stringify(screen==='recommend')})return JSON.stringify([[0],[0],[0],[0],[0],[0],[0],[5]]);if(k.startsWith('nsp-center:'))return null;return get.call(this,k)};Storage.prototype.setItem=function(k,v){if(!k.startsWith('nsp-center:'))set.call(this,k,v)};Storage.prototype.removeItem=function(k){if(!k.startsWith('nsp-center:'))remove.call(this,k)};})();`;
 html=html.replace('<head>','<head><script>'+setup+'<\/script>');
 if(screen==='article')html=html.replace(/(<script type="application\/json" id="nsp-page-data">)[\s\S]*?(<\/script>)/,(_m,a,b)=>a+JSON.stringify({article}).replace(/</g,'\\u003c')+b);
 if(screen==='knowledge-product')html=html.replace(/(<script type="application\/json" id="nsp-page-data">)[\s\S]*?(<\/script>)/,(_m,a,b)=>a+JSON.stringify({product:newProduct}).replace(/</g,'\\u003c')+b);
 document.open();document.write(html);document.close();
})().catch(e=>document.body.textContent='Не удалось открыть пример: '+e.message);
</script></body></html>
