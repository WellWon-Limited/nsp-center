<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Карточки — светлые фоны</title><style>html,body{margin:0;height:100%;background:#eaf3f1}iframe{width:100%;height:100%;border:0;display:block;visibility:hidden}iframe.ready{visibility:visible}</style><iframe src="/catalog/?view=products" title="Оформление каталога с ботаническими акцентами"></iframe><script>
const v=Math.max(1,Math.min(3,Number(new URLSearchParams(location.search).get('v'))||1));document.title=['','01 · Стекло и светлая мята','02 · Стекло и светлый серый','03 · Как в прототипе'][v];
const base='/images/catalog-concepts-2026-11-13/';
const items=[['aloe-vera-juice','aloe','473 мл · жидкость','Концентрат алоэ вера'],['alfalfa','alfalfa','100 капсул · БАД','Люцерна'],['antioxidant','turmeric','60 капсул · БАД','Куркума и растительный комплекс']];
const frame=document.querySelector('iframe');frame.addEventListener('load',async()=>{
const d=frame.contentDocument,w=frame.contentWindow;if(!d)return;
await new Promise(resolve=>{const root=d.querySelector('#root');if(!root||root.dataset.hydrated==='true'){resolve();return}const o=new MutationObserver(()=>{if(root.dataset.hydrated==='true'){o.disconnect();resolve()}});o.observe(root,{attributes:true,attributeFilter:['data-hydrated']})});
d.documentElement.dataset.botanicalCards=String(v);
const grid=d.querySelector('.catalog-layout .product-grid');if(!grid){frame.classList.add('ready');return}
const chosen=[];
for(const [id,plant,size,ingredient]of items){const card=[...grid.children].find(c=>c.querySelector('a[href="/product/'+id+'/"]'));if(!card)continue;
card.dataset.previewProduct=id;card.dataset.ingredient=plant;chosen.push(card);
const visual=card.querySelector('.product-visual'),meta=card.querySelector('.product-meta'),title=meta.querySelector('.card-title'),kicker=meta.querySelector('.ds-kicker');
const photo=d.createElement('img');photo.src=base+plant+'-v1.png';photo.className='botanical-accent';photo.alt='';photo.setAttribute('aria-hidden','true');visual.append(photo);
const sizeLine=d.createElement('p');sizeLine.className='catalog-pack-size';sizeLine.textContent=size;title.after(sizeLine);
const ingredientLine=meta.querySelector('.card-parts');ingredientLine.textContent=ingredient;
kicker.remove();
const stock=meta.querySelector('.stock-pill');if(stock)visual.append(stock);
}
grid.prepend(...chosen);
const rules=[],prefix='html[data-botanical-cards] body .site-main .catalog-page ';
const put=(selector,css)=>rules.push(prefix+selector+'{'+css.replace(/;?$/,';').replaceAll(';','!important;')+'}');
put('.product-grid','gap:var(--space-24);align-items:stretch');
put('.product-card.panel','background:var(--color-white);padding:var(--space-12);border:0;border-radius:var(--radius-panel);box-shadow:none');
put('.product-card[data-preview-product]','--photo-height:250px;--photo-tone:var(--color-mint-tint)');
put('.product-card[data-ingredient="alfalfa"]','--photo-tone:var(--color-blue)');
put('.product-card[data-ingredient="turmeric"]','--photo-tone:var(--color-sand)');
put('.product-card[data-preview-product] .product-visual','height:var(--photo-height);background:var(--photo-tone);border-radius:var(--radius-20);isolation:isolate');
put('.product-card[data-preview-product] .product-visual>a','position:relative;z-index:1;padding:var(--space-20);background:transparent;justify-content:center');
put('.product-card[data-preview-product] .product-packshot-frame','width:min(46%,calc((var(--photo-height) - 40px) * var(--packshot-ratio)));aspect-ratio:var(--packshot-ratio);height:auto;transform:none');
put('.product-card[data-preview-product] .product-packshot-frame>img','-webkit-mask-image:url("'+base+'amber-mask.svg");mask-image:url("'+base+'amber-mask.svg");-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;mix-blend-mode:normal');
put('.product-card[data-ingredient="aloe"] .product-packshot-frame>img','-webkit-mask-image:url("'+base+'aloe-mask.svg");mask-image:url("'+base+'aloe-mask.svg")');
put('.product-visual .botanical-accent','position:absolute;z-index:0;bottom:0;right:0;width:70%;height:auto;max-width:none;max-height:none;object-fit:contain;transform:none;mix-blend-mode:normal;pointer-events:none');
put('.product-card[data-preview-product] .favorite','z-index:3;top:var(--space-8);right:var(--space-8);background:var(--color-glass-raised);border:0');
put('.product-card[data-preview-product] .stock-pill','position:absolute;bottom:var(--space-8);left:var(--space-8);top:auto;transform:none;background:var(--color-glass-strong);color:var(--color-muted);font-size:var(--text-11);z-index:2');
put('.product-meta','padding:var(--space-18) var(--space-8) var(--space-8);min-width:0');
put('.product-meta .card-title','height:auto;min-height:82px');
put('.product-meta .card-title h3','font-size:var(--text-18);line-height:1.3;margin:0 0 var(--space-6);min-height:0');
put('.product-meta .card-sub','font-size:var(--text-14);line-height:1.4;color:var(--color-body)');
put('.catalog-pack-size','font-size:var(--text-13);font-weight:600;color:var(--color-muted);margin:var(--space-8) 0 0;line-height:1.4');
put('.product-meta .card-parts','font-size:var(--text-12);color:var(--color-muted);margin:var(--space-6) 0 0;white-space:normal;min-height:1.4em');
put('.product-meta .product-info','margin-top:var(--space-10)');
put('.product-meta .product-bottom','padding-top:var(--space-14)');
put('.product-meta .product-bottom strong','font-size:var(--text-22)');
put('.product-meta>.btn','min-height:46px;font-size:var(--text-13);border-radius:var(--radius-control);margin-top:var(--space-12)');
// Same approved text hierarchy in each option, without a reserved empty line.
put('.product-grid','grid-template-columns:repeat(3,minmax(0,1fr))');
put('.product-meta .card-title','height:auto;min-height:0');
put('.product-meta .card-title h3','margin:0 0 var(--space-6)');
put('.product-meta','flex:0 0 auto');
put('.catalog-pack-size','margin:var(--space-8) 0 0');
put('.product-meta .product-bottom','margin-top:var(--space-12);padding-top:0');
put('.product-card[data-preview-product]','--photo-tone:var(--color-mint-tint)');
put('.product-card[data-preview-product] .product-visual>a','justify-content:flex-start;padding-left:22%');
put('.product-card[data-preview-product] .botanical-accent','width:62%;right:-3%;bottom:var(--space-8);opacity:.9');
if(v===2){
 put('.product-card[data-preview-product]','--photo-tone:color-mix(in srgb,var(--color-muted) 7%,var(--color-white))');
}
if(v===3){
 put('.product-card[data-preview-product]','--photo-tone:color-mix(in srgb,var(--color-mint) 15%,var(--color-white))');
 put('.product-card[data-preview-product] .product-visual','background:repeating-linear-gradient(135deg,var(--color-ink-soft) 0 6px,transparent 6px 12px),var(--photo-tone)');
 put('.product-card[data-preview-product] .product-visual>a','justify-content:center;padding-left:var(--space-20)');
 put('.product-card[data-preview-product] .botanical-accent','display:none');
}
// Outer glass shell comes directly from the supplied prototype's catalog card.
put('.product-card.panel','padding:var(--space-10);border-radius:var(--radius-22);background:var(--color-glass);border:1px solid var(--color-glass-border);backdrop-filter:blur(var(--blur-20));-webkit-backdrop-filter:blur(var(--blur-20));box-shadow:none');
put('.product-card[data-preview-product] .product-visual','border-radius:var(--radius-16)');
put('.product-card .product-meta','background:transparent;padding:var(--space-14) var(--space-8) var(--space-8);border:0');
const style=d.createElement('style');style.textContent=rules.join('\n');d.head.append(style);frame.classList.add('ready');
});
</script></html>
